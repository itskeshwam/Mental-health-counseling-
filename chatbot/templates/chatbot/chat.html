{% extends 'base.html' %}

{% block title %}Mental Health Support Chatbot{% endblock %}

{% block content %}
<main class="page">
    <h1>Mental Health Support Chatbot</h1>
    <p class="intro">Share what is on your mind. This chatbot is not a substitute for professional mental health care or emergency support.</p>

    <div id="chatArea" class="chat-area" role="log" aria-live="polite" aria-relevant="additions"></div>

    <form id="chatForm" class="chat-form" method="post">
        {% csrf_token %}
        <label class="visually-hidden" for="userInput">Your message</label>
        <input type="text" id="userInput" name="user_input" maxlength="4000"
               placeholder="Type your message here..." autocomplete="off" required>
        <button id="sendButton" type="submit">Send</button>
    </form>
    <p id="statusMessage" class="status" role="status" aria-live="polite"></p>
</main>

<script>
(function () {
    const form = document.getElementById("chatForm");
    const input = document.getElementById("userInput");
    const chatArea = document.getElementById("chatArea");
    const sendButton = document.getElementById("sendButton");
    const statusMessage = document.getElementById("statusMessage");

    function appendMessage(message, isUser) {
        const wrapper = document.createElement("div");
        wrapper.className = isUser ? "chat-message user-message" : "chat-message bot-message";

        const bubble = document.createElement("div");
        bubble.className = "chat-bubble";
        bubble.textContent = message;

        wrapper.appendChild(bubble);
        chatArea.appendChild(wrapper);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const message = input.value.trim();
        if (!message) {
            statusMessage.textContent = "Please enter a message.";
            input.focus();
            return;
        }

        appendMessage(message, true);
        input.value = "";
        input.disabled = true;
        sendButton.disabled = true;
        statusMessage.textContent = "The chatbot is responding...";

        try {
            const response = await fetch("", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
                    "X-CSRFToken": form.querySelector("[name=csrfmiddlewaretoken]").value
                },
                body: new URLSearchParams({user_input: message}),
                credentials: "same-origin"
            });
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "The message could not be sent.");
            }

            appendMessage(data.reply, false);
            statusMessage.textContent = "";
        } catch (error) {
            statusMessage.textContent = error.message || "Something went wrong. Please try again.";
        } finally {
            input.disabled = false;
            sendButton.disabled = false;
            input.focus();
        }
    });
})();
</script>

<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 24px;
        background: #f4f6f8;
        color: #202833;
        font-family: Arial, sans-serif;
    }
    .page { max-width: 800px; margin: 24px auto; }
    h1 { text-align: center; }
    .intro { color: #586575; line-height: 1.5; text-align: center; }
    .chat-area {
        min-height: 400px;
        max-height: 60vh;
        overflow-y: auto;
        padding: 16px;
        border: 1px solid #d6dce2;
        border-radius: 12px;
        background: #fff;
    }
    .chat-message { display: flex; margin: 12px 0; }
    .user-message { justify-content: flex-end; }
    .bot-message { justify-content: flex-start; }
    .chat-bubble {
        max-width: 80%;
        padding: 11px 15px;
        border-radius: 14px;
        line-height: 1.5;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
    }
    .user-message .chat-bubble { background: #1769aa; color: #fff; }
    .bot-message .chat-bubble { background: #e9edf1; color: #202833; }
    .chat-form { display: flex; gap: 10px; margin-top: 12px; }
    .chat-form input {
        flex: 1;
        min-width: 0;
        padding: 12px 14px;
        border: 1px solid #c8d0d8;
        border-radius: 8px;
        font-size: 16px;
    }
    .chat-form button {
        padding: 12px 20px;
        border: 0;
        border-radius: 8px;
        background: #1769aa;
        color: white;
        cursor: pointer;
    }
    .chat-form button:disabled { opacity: .6; cursor: wait; }
    .status { min-height: 1.5em; color: #586575; }
    .visually-hidden {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    @media (max-width: 520px) {
        body { padding: 12px; }
        .chat-form { flex-direction: column; }
        .chat-form button { width: 100%; }
        .chat-bubble { max-width: 95%; }
    }
</style>
{% endblock %}
